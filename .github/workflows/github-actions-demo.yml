name: Github Actions Demo
run-name: ABC
permissions:
  pull-requests: write
on:
  pull_request:

env:
  TF_VERSION: "1.15"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      WITAMY: witanko powitanko
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
      - name: Show checked out commit
        run: |
          echo "Checked out commit:"
          git rev-parse HEAD
          
          echo "GitHub SHA:"
          echo "$GITHUB_SHA"

