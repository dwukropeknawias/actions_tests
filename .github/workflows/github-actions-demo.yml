name: Github Actions Demo
run-name: ABC
permissions:
  pull-requests: write
on:
  pull_request:
    types:
      - opened
      - reopened

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - name: "comment"
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.html_url }}

        run: |
          gh pr edit $PR --add-label 'invalid'
          gh pr comment $PR --body 'THis is deeeemo'