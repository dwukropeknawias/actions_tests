name: Github Actions Demo
run-name: ABC
permissions:
  pull-requests: write
on:
  push:
    branches:
      - main

env:
  TF_VERSION: "1.15"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
      - name: testing
        run: |
          ls -a
      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}


