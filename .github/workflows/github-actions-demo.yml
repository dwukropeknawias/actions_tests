name: Github Actions Demo
run-name: ${{ github.actor }} is testing out Github Actions!
on: [push]
jobs:
  Explore-Github-Actions:
    runs-on: ubuntu-latest
    steps:
      - run: echo "This job was automatically triggered by ${{ github.event_name }} event."
      - run: echo "This job is now running on ${{ runner.os }} server hosted by Github."
      - run: echo "The name of your branch is ${{ github.ref }} and your repository is ${{ github.repository }}."
      - name: Check out repository code
        uses: actions/checkout@v6
      - run: echo "The repository ${{ github.repository }} has been cloned to the runner."
      - run: echo "The workflow is ready to test your code on the runner."
      - name: List files in the repository
        run: |
          ls ${{ github.workspace }}
      - run: echo "This job status is ${{ job.status }}."