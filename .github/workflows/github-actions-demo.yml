name: Github Actions Demo
run-name: ABC
on:
  pull_request:
    types:
      - opened

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - name: "comment"
        env:
          PR: ${{ github.event.pull_request.html_url }}

        run: |
          gh pr edit $PR --add-label 'invalid'
          gh pr comment $PR --body 'THis is deeeemo'