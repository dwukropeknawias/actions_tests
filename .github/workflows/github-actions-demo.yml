name: Github Actions Demo
run-name: ABC
permissions:
  pull-requests: write
on:
  pull_request:

env:
  TF_VERSION: "1.15"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      WITAMY: witanko powitanko
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
      - uses: docker/metadata-action@v6.2.0
        id: meta
        with:
          images: bajlando
          tags: |
            type=sha,prefix=,format=short

      - run: echo ${{ steps.meta.outputs.tags }} ok1

